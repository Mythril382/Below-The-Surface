team.below-malis.name = Malis
team.below-malis.description = The only active faction on Erekir. They have an extreme amount of power and are more intelligent than the [red]Crux[]. They like to keep their capital planet to themselves and won't hesitate to start a war with those who seek to conquer the planet.
